version: "3.7"

# Modelo da stack Traefik. O install.sh gera traefik.generated.yaml a partir deste arquivo:
#   __ACME_EMAIL__   e-mail do Let's Encrypt
#   linhas marcadas com "#ACME" sao removidas quando nenhum e-mail e informado

services:

  traefik:
    image: traefik:v3.7
    command:
      - "--api.dashboard=false"
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=__NETWORK_NAME__"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=3600"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true" #ACME
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web" #ACME
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/etc/traefik/letsencrypt/acme.json" #ACME
      - "--certificatesresolvers.letsencryptresolver.acme.email=__ACME_EMAIL__" #ACME
      - "--log.level=INFO"
      - "--accesslog=false"

    volumes:
      - "vol_certificates:/etc/traefik/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

    networks:
      - network_public

    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host

    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s

volumes:
  vol_certificates:
    external: true
    name: volume_swarm_certificates

networks:
  network_public:
    external: true
    name: __NETWORK_NAME__
