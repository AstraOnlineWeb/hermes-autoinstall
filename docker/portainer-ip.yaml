version: "3.7"

# Portainer SEM subdominio: acesso direto por https://IP:__PORTAINER_PORT__
# (certificado autoassinado do proprio Portainer; o navegador mostra um aviso na primeira vez).
# Placeholders: __PORTAINER_PORT__  __NETWORK_NAME__

services:

  agent:
    image: portainer/agent:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - network_public
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify --admin-password-file /run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    volumes:
      - portainer_data:/data
    networks:
      - network_public
    ports:
      - target: 9443
        published: __PORTAINER_PORT__
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s

secrets:
  portainer_admin_password:
    external: true

networks:
  network_public:
    external: true
    name: __NETWORK_NAME__

volumes:
  portainer_data:
    external: true
    name: portainer_data
